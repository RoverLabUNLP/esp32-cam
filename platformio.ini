[platformio]
src_dir = .
include_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = huge_app.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
; upload_port = COM4  ; Modificar los COMM a los que corresponda
; monitor_port = COM4
lib_deps =
    links2004/WebSockets@^2.4.1
    tzapu/WiFiManager@^2.0.17
